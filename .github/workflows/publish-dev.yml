name: Publish End-User Dev Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Update dev distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare dev branch
        run: |
          set -e

          rm -rf /tmp/trip-dev
          mkdir -p /tmp/trip-dev

          # Application
          cp -R app /tmp/trip-dev/
          cp -R src /tmp/trip-dev/

          # Public and runtime files
          cp -R public /tmp/trip-dev/
          cp -R storage /tmp/trip-dev/

          # Framework configuration
          cp -R config /tmp/trip-dev/
          cp -R database /tmp/trip-dev/

          cp -R .env.example /tmp/trip-dev/.env.example
          cp -R .htaccess /tmp/trip-dev/.htaccess
          cp -R .gitignore /tmp/trip-dev/.gitignore 

          # Composer
          cp composer.json /tmp/trip-dev/
          cp composer.lock /tmp/trip-dev/

          # CLI
          cp trip /tmp/trip-dev/

          # Remove uploaded files but keep .gitkeep
          if [ -d "/tmp/trip-dev/storage/app/uploads" ]; then
            find /tmp/trip-dev/storage/app/uploads \
              -type f ! -name '.gitkeep' -delete
          fi

          if [ -d "/tmp/trip-dev/public/uploads" ]; then
            find /tmp/trip-dev/public/uploads \
              -type f ! -name '.gitkeep' -delete
          fi

          # Make sure upload directories exist
          mkdir -p /tmp/trip-dev/storage/app/uploads
          mkdir -p /tmp/trip-dev/public/uploads

          touch /tmp/trip-dev/storage/app/uploads/.gitkeep
          touch /tmp/trip-dev/public/uploads/.gitkeep

      - name: Switch to dev branch
        run: |
          git fetch origin dev
          git checkout dev

      - name: Replace dev contents
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          cp -R /tmp/trip-dev/. .

      - name: Commit distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Sync dev with main"

      - name: Push dev branch
        run: |
          git push origin dev