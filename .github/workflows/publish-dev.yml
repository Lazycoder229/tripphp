name: Publish End-User Dev Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Update dev distribution
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout MAIN
      # ==========================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==========================================
      # Prepare clean distribution
      # ==========================================

      - name: Prepare dev distribution
        run: |
          set -e

          rm -rf /tmp/trip-dev
          mkdir -p /tmp/trip-dev

          # ==========================================
          # Application structure
          # ==========================================

          mkdir -p /tmp/trip-dev/app/Controller
          mkdir -p /tmp/trip-dev/app/Middleware
          mkdir -p /tmp/trip-dev/app/Models
          mkdir -p /tmp/trip-dev/app/Views
          mkdir -p /tmp/trip-dev/app/Views/Layouts
          mkdir -p /tmp/trip-dev/app/Views/Errors

          # ==========================================
          # Controllers
          # Keep ONLY the default HomeController
          # ==========================================

          cp app/Controller/HomeController.php \
            /tmp/trip-dev/app/Controller/HomeController.php

          # ==========================================
          # Middleware
          # Keep folder only
          # ==========================================

          touch /tmp/trip-dev/app/Middleware/.gitkeep

          # ==========================================
          # Models
          # Keep folder only
          # ==========================================

          touch /tmp/trip-dev/app/Models/.gitkeep

         
          # ==========================================
          # Layouts
          # Keep ALL layout files
          # ==========================================

          cp -R app/views/Layouts/. \
            /tmp/trip-dev/app/views/Layouts/

          # ==========================================
          # Errors
          # Keep ALL error view files
          # ==========================================

          cp -R app/views/Errors/. \
            /tmp/trip-dev/app/views/Errors/

          # ==========================================
          # Framework source
          # ==========================================

          cp -R src /tmp/trip-dev/

          # ==========================================
          # Public and runtime files
          # ==========================================

          cp -R public /tmp/trip-dev/
          cp -R storage /tmp/trip-dev/

          # ==========================================
          # Configuration
          # ==========================================

          cp -R config /tmp/trip-dev/
          cp -R database /tmp/trip-dev/

          cp .env.example /tmp/trip-dev/.env.example
          cp .htaccess /tmp/trip-dev/.htaccess
          cp .gitignore /tmp/trip-dev/.gitignore

          # ==========================================
          # Composer
          # Taken directly from MAIN
          # ==========================================

          cp composer.json /tmp/trip-dev/composer.json
          cp composer.lock /tmp/trip-dev/composer.lock

          # ==========================================
          # CLI
          # ==========================================

          cp trip /tmp/trip-dev/

          # ==========================================
          # Remove uploaded files
          # ==========================================

          if [ -d "/tmp/trip-dev/storage/app/uploads" ]; then
            find /tmp/trip-dev/storage/app/uploads \
              -type f ! -name '.gitkeep' -delete
          fi

          if [ -d "/tmp/trip-dev/public/uploads" ]; then
            find /tmp/trip-dev/public/uploads \
              -type f ! -name '.gitkeep' -delete
          fi

          # ==========================================
          # Make sure upload directories exist
          # ==========================================

          mkdir -p /tmp/trip-dev/storage/app/uploads
          mkdir -p /tmp/trip-dev/public/uploads

          touch /tmp/trip-dev/storage/app/uploads/.gitkeep
          touch /tmp/trip-dev/public/uploads/.gitkeep

          # ==========================================
          # Show Composer configuration
          # ==========================================

          echo "=========================================="
          echo "Distribution composer.json"
          echo "=========================================="

          cat /tmp/trip-dev/composer.json

          # ==========================================
          # Show application structure
          # ==========================================

          echo "=========================================="
          echo "Distribution app structure"
          echo "=========================================="

          find /tmp/trip-dev/app -maxdepth 3 -print

      # ==========================================
      # Validate the DISTRIBUTION
      # ==========================================

      - name: Validate dev distribution
        run: |
          set -e

          composer validate --strict \
            --working-dir=/tmp/trip-dev

      # ==========================================
      # Switch to DEV
      # ==========================================

      - name: Switch to dev branch
        run: |
          set -e

          git fetch origin dev
          git checkout dev

          echo "Current branch:"
          git branch --show-current

      # ==========================================
      # Replace DEV contents
      # ==========================================

      - name: Replace dev contents
        run: |
          set -e

          echo "Removing old dev contents..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          echo "Copying clean distribution..."

          cp -R /tmp/trip-dev/. .

          echo "=========================================="
          echo "Final dev application structure"
          echo "=========================================="

          find app -maxdepth 3 -print

      # ==========================================
      # Commit
      # ==========================================

      - name: Commit distribution
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Sync dev with main"

      # ==========================================
      # Push DEV
      # ==========================================

      - name: Push dev branch
        run: |
          set -e

          git push origin dev