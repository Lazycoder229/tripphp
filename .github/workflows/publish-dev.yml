- name: Prepare dev branch
  run: |
    set -e

    rm -rf /tmp/trip-dev
    mkdir -p /tmp/trip-dev

    # ==========================================
    # Application structure
    # Create folders only - do not copy app files
    # ==========================================

    mkdir -p /tmp/trip-dev/app/Controllers
    mkdir -p /tmp/trip-dev/app/Middleware
    mkdir -p /tmp/trip-dev/app/Models
    mkdir -p /tmp/trip-dev/app/Views/Layouts
    mkdir -p /tmp/trip-dev/app/Views/Errors

    # Keep empty folders in Git
    touch /tmp/trip-dev/app/Controllers/.gitkeep
    touch /tmp/trip-dev/app/Middleware/.gitkeep
    touch /tmp/trip-dev/app/Models/.gitkeep
    touch /tmp/trip-dev/app/Views/.gitkeep
    touch /tmp/trip-dev/app/Views/Layouts/.gitkeep
    touch /tmp/trip-dev/app/Views/Errors/.gitkeep

    # ==========================================
    # Framework source
    # ==========================================

    cp -R src /tmp/trip-dev/

    # ==========================================
    # Public and runtime files
    # ==========================================

    cp -R public /tmp/trip-dev/
    cp -R storage /tmp/trip-dev/

    # ==========================================
    # Framework configuration
    # ==========================================

    cp -R config /tmp/trip-dev/
    cp -R database /tmp/trip-dev/

    cp .env.example /tmp/trip-dev/.env.example
    cp .htaccess /tmp/trip-dev/.htaccess
    cp .gitignore /tmp/trip-dev/.gitignore

    # ==========================================
    # Composer
    # ==========================================

    cp composer.json /tmp/trip-dev/
    cp composer.lock /tmp/trip-dev/

    # ==========================================
    # CLI
    # ==========================================

    cp trip /tmp/trip-dev/

    # ==========================================
    # Remove uploaded files
    # ==========================================

    if [ -d "/tmp/trip-dev/storage/app/uploads" ]; then
      find /tmp/trip-dev/storage/app/uploads \
        -type f ! -name '.gitkeep' -delete
    fi

    if [ -d "/tmp/trip-dev/public/uploads" ]; then
      find /tmp/trip-dev/public/uploads \
        -type f ! -name '.gitkeep' -delete
    fi

    # Make sure upload directories exist
    mkdir -p /tmp/trip-dev/storage/app/uploads
    mkdir -p /tmp/trip-dev/public/uploads

    touch /tmp/trip-dev/storage/app/uploads/.gitkeep
    touch /tmp/trip-dev/public/uploads/.gitkeep